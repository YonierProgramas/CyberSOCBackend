services:
  - type: web
    name: cybersoc-backend
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: HOST
        value: 0.0.0.0
