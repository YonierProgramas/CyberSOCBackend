        "properties": {
          "purpose": {
            "type": "string",
            "enum": [
              "scan_summaries",
              "report_storage"
            ]
          },
          "granted": {
            "type": "boolean"
          },
          "policyVersion": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 40
              },
              {
                "type": "null"
              }
            ]
          },
          "currentPolicyVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "needsRenewal": {
            "type": "boolean"
          },
          "effective": {
            "type": "boolean"
          },
          "changedAt": {
            "anyOf": [
