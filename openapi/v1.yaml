                "minLength": 1,
                "maxLength": 40
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "granted"
            ],
            "properties": {
              "granted": {
                "const": false
              },
              "policyVersion": {
                "type": "string",
                "maxLength": 40,
                "description": "Opcional; se ignora al retirar."
              }
            }
          }
        ]
      },
