              "es-CO",
              "es"
            ]
          },
          "timezone": {
            "type": "string",
            "maxLength": 100,
            "description": "Solo valores de Intl.supportedValuesOf(timeZone) en Node 24."
          },
          "theme": {
            "type": "string",
            "enum": [
              "system",
              "light",
              "dark"
            ]
          }
        }
      },
      "PreferencePatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {
          "locale": {
            "type": "string",
            "enum": [
              "es-CO",
              "es"
            ]
          },
          "timezone": {
            "type": "string",
            "maxLength": 100,
            "description": "Solo valores de Intl.supportedValuesOf(timeZone) en Node 24."
          },
          "theme": {
            "type": "string",
            "enum": [
              "system",
              "light",
              "dark"
            ]
          }
        },
        "minProperties": 1
      },
      "ProfileInput": {
        "type": "object",
