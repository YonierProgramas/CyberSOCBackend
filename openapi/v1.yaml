    "description": "Rutas implementadas; requieren configuración P0. Sin configurar solo healthz/base. No login/contraseñas, P1/P2 o actividad opcional. Auth por Supabase; JWT ES256/RS256, issuer/aud/role y exp (30 s). Release ausente: 503 sin enlace inventado. JSON UTF-8 ≤16 KiB; campos/query desconocidos o repetidos rechazados. healthz describe capacidades habilitadas, no comprueba conexión remota."
